[build]
  command = "echo 'No build command needed'"

[dev]
  command = "npx serve"
  port = 3000
  targetPort = 3000
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[context.production.environment]
  NETLIFY_DEV_HUD_ENABLED = "false"
